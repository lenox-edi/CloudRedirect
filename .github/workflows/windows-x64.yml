name: CloudRedirect Community Windows x64

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-x64.yml'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'ui/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout do codigo fonte comunitario
        uses: actions/checkout@v4

      - name: Verificar que a DLL nao usa o patch experimental
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path 'src/common/rpc_handlers.cpp')) { throw 'Codigo fonte ausente' }
          if (Select-String -Path 'src/common/rpc_handlers.cpp' -Pattern 'changelist_cache_policy.h' -SimpleMatch -Quiet) {
            throw 'O patch experimental ainda esta no motor! Reverter ao arquivo comunitario antes de compilar.'
          }
          if (Select-String -Path 'CMakeLists.txt' -Pattern 'add_executable(changelist_cache_policy_tests' -SimpleMatch -Quiet) {
            throw 'Ainda existe alvo de teste experimental no CMake.'
          }
          Write-Host 'Codigo comunitario original verificado'

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Configurar C++ Windows x64
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'CMake config falhou' }

      - name: Compilar DLL comunitaria e CLI
        shell: pwsh
        run: |
          cmake --build build --config Release --target cloud_redirect cloud_redirect_cli --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Build C++ falhou' }
          if (!(Test-Path 'build/Release/cloud_redirect.dll')) { throw 'Nao gerou cloud_redirect.dll' }

      - name: Compilar EXE com DLL comunitaria embutida
        shell: pwsh
        run: |
          dotnet publish ui/CloudRedirect.csproj -c Release -r win-x64 --self-contained false -o publish
          if ($LASTEXITCODE -ne 0) { throw 'Build WPF falhou' }
          if (!(Test-Path 'publish/CloudRedirect.exe')) { throw 'Nao gerou CloudRedirect.exe' }
          if (!(Test-Path 'ui/Resources/cloud_redirect.dll')) { throw 'DLL nao foi embutida' }
          if ((Get-FileHash 'ui/Resources/cloud_redirect.dll').Hash -ne (Get-FileHash 'build/Release/cloud_redirect.dll').Hash) {
            throw 'A DLL embutida no EXE difere da DLL compilada!'
          }

      - name: Empacotar somente EXE e DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item publish/CloudRedirect.exe dist/CloudRedirect.exe
          Copy-Item build/Release/cloud_redirect.dll dist/cloud_redirect.dll
          if ((Get-ChildItem dist -File).Count -ne 2) { throw 'Pacote deve conter exatamente dois arquivos' }

      - name: Disponibilizar EXE e DLL
        uses: actions/upload-artifact@v4
        with:
          name: CloudRedirect-Community-Edileno-win-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
